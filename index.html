<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROGESYS · Sistema de Gestión Call Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --navy:#0B2545; --navy-2:#13315C; --navy-3:#1D4E89;
  --teal:#0FA3A3; --teal-2:#14B8A6; --teal-soft:#E0F5F3;
  --white:#FFFFFF; --bg:#F4F6F9; --line:#E3E8EF;
  --ink:#0B2545; --ink-soft:#5B6B82; --ink-faint:#93A1B5; --ink-strong:#0B2545;
  --ok:#1F9D55; --ok-bg:#E7F6EC; --warn:#C9880A; --warn-bg:#FCF3DC; --bad:#C0392B; --bad-bg:#FBE9E7;
  --radius:12px; --shadow:0 1px 3px rgba(11,37,69,.08),0 4px 14px rgba(11,37,69,.06);
}
:root[data-theme="dark"]{
  --navy-2:#1B3E6B; --navy-3:#2A5A9C;
  --teal-soft:#0F2E30;
  --white:#141E2C; --bg:#0A1220; --line:#243044;
  --ink:#E7ECF3; --ink-soft:#A8B4C6; --ink-faint:#71809A; --ink-strong:#EAF1FF;
  --ok-bg:#0F2A1B; --warn-bg:#332A0F; --bad-bg:#33150F;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);
}
body,.card,.panel,table,th,td,input,select,textarea{transition:background-color .2s,color .2s,border-color .2s}
:root[data-theme="dark"] table{background:var(--white)}
:root[data-theme="dark"] .form,.dark-fix{background:#0F2E30}
:root[data-theme="dark"] .login-card{background:var(--white)}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:var(--bg);color:var(--ink);border-color:var(--line)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
#app{display:flex;min-height:100vh}

/* ── Sidebar ─────────────────────────── */
aside{width:232px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.iso{width:38px;height:38px;flex-shrink:0}
.brand-name{font-size:17px;font-weight:800;letter-spacing:.14em}
.brand-sub{font-size:9.5px;letter-spacing:.22em;color:var(--teal-2);font-weight:600;margin-top:1px}
nav{flex:1;overflow-y:auto;padding:10px 0}
nav .grp{font-size:9.5px;letter-spacing:.18em;color:rgba(255,255,255,.45);padding:12px 18px 5px;font-weight:700}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.82);padding:9px 18px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;font-family:inherit}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:rgba(15,163,163,.16);border-left-color:var(--teal-2);color:#fff;font-weight:600}
nav button .ic{width:17px;text-align:center;opacity:.85}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:rgba(255,255,255,.5)}

/* ── Main ────────────────────────────── */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:var(--white);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;font-weight:700;color:var(--ink-strong)}
header.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:8px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-teal{background:var(--teal);color:#fff}
.btn-navy{background:var(--navy-2);color:#fff}
.btn-ghost{background:var(--bg);color:var(--navy-2);border:1px solid var(--line)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:12px}
section.page{padding:22px 26px 60px;display:none}
section.page.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;border-top:3px solid var(--teal)}
.card .k{font-size:11.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center}
.card .v{font-size:27px;font-weight:800;color:var(--ink-strong);margin:5px 0 2px}
.card .m{font-size:11px;color:var(--ink-faint)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.V{background:var(--ok)} .dot.A{background:var(--warn)} .dot.R{background:var(--bad)} .dot.N{background:var(--ink-faint)}
.panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px}
.panel h2{font-size:14px;font-weight:700;color:var(--ink-strong);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:4px;height:16px;background:var(--teal);border-radius:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:180px;max-width:340px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg)}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.8px;background:#fff}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-weight:600;font-size:11.5px;letter-spacing:.03em;white-space:nowrap;position:sticky;top:0}
td{padding:8px 11px;border-top:1px solid var(--line);white-space:nowrap;color:var(--ink)}
tr:hover td{background:var(--teal-soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.pill.V{background:var(--ok-bg);color:var(--ok)} .pill.A{background:var(--warn-bg);color:var(--warn)} .pill.R{background:var(--bad-bg);color:var(--bad)} .pill.N{background:var(--bg);color:var(--ink-soft)}
.empty{padding:34px;text-align:center;color:var(--ink-faint);font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px;background:var(--teal-soft);padding:16px;border-radius:10px;border:1px solid #BFE8E4}
.form label{font-size:11px;font-weight:700;color:var(--navy-2);display:block;margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;background:#fff}
.form .full{grid-column:1/-1}
.form .actions{grid-column:1/-1;display:flex;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.bar-row .lbl{width:130px;flex-shrink:0;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:14px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-2));border-radius:99px}
.bar-val{width:52px;text-align:right;font-weight:700;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:980px){.grid-2{grid-template-columns:1fr}aside{width:64px}.brand-name,.brand-sub,nav .grp,nav button .tx,.side-foot{display:none}nav button{justify-content:center;padding:11px 0}}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info-grid .cell{background:var(--bg);border-radius:9px;padding:10px 13px}
.info-grid .cell .k{font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.05em}
.info-grid .cell .v{font-size:14px;font-weight:700;color:var(--ink-strong);margin-top:2px}
.turn-cell{display:inline-block;width:26px;height:22px;line-height:22px;text-align:center;border-radius:5px;font-size:11px;font-weight:700}
.tA{background:var(--teal-soft);color:var(--teal)} .tB{background:#E3EDF9;color:var(--navy-3)} .tC{background:#EFE9FB;color:#6B4EAE} .tD{background:var(--warn-bg);color:var(--warn)} .tV{background:var(--bg);color:var(--ink-faint)} .tX{background:var(--bad-bg);color:var(--bad)}
#toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;display:none;z-index:99;max-width:420px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:10px}
.ind-panel{padding:0}
.ind-panel>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink-strong);font-size:14px;user-select:none}
.ind-panel>summary::-webkit-details-marker{display:none}
.ind-panel>summary::before{content:"";width:4px;height:16px;background:var(--teal);border-radius:2px;flex-shrink:0}
.ind-count{font-weight:500;color:var(--ink-faint);font-size:12px}
.ind-arrow{margin-left:auto;color:var(--ink-faint);transition:transform .15s;font-size:12px}
.ind-panel[open] .ind-arrow{transform:rotate(90deg)}
.ind-body{padding:2px 20px 18px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.ind-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;transition:background .15s,border-color .15s,color .15s}
.ind-chip:hover{border-color:var(--teal)}
.ind-chip.on{background:var(--teal-soft);border-color:var(--teal);color:var(--ink-strong);font-weight:600}
.ind-chip input{accent-color:var(--teal);width:14px;height:14px;flex-shrink:0}
.legend span{display:flex;align-items:center;gap:6px}
ol.instr{padding-left:22px;line-height:2;font-size:13.5px;color:var(--ink)}
ol.instr b{color:var(--teal)}
.filebtn input{display:none}
#loginScreen,#cambiarClaveScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,var(--teal) 220%)}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:36px 34px;width:340px;max-width:92vw}
.login-card .brand{padding:0 0 20px;border:none;justify-content:center}
.login-card h2{font-size:16px;color:var(--navy);text-align:center;margin-bottom:20px;font-weight:700}
.login-card label{font-size:12px;font-weight:700;color:var(--navy-2);display:block;margin:12px 0 4px}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.login-card .btn{width:100%;justify-content:center;margin-top:20px;padding:11px}
.login-err{color:var(--bad);font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}
.user-badge{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.user-badge b{color:var(--ink-strong)}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <svg class="iso" viewBox="0 0 40 40"><path d="M6 4h13a11 11 0 0 1 0 22H14v10H6V4zm8 7v8h5a4 4 0 0 0 0-8h-5z" fill="#14B8A6"/><path d="M27 26l7 7-7 7v-4.5h-5v-5h5V26z" fill="#0FA3A3" opacity=".85"/></svg>
      <div><div class="brand-name">PROGESYS</div><div class="brand-sub">CALL CENTER SUITE</div></div>
    </div>
    <h2>Inicia sesión</h2>
    <label>Usuario</label>
    <input type="text" id="loginEmail" autocomplete="username" placeholder="tu.usuario" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
    <button class="btn btn-teal" id="loginBtn" onclick="hacerLogin()">Ingresar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>
<div id="cambiarClaveScreen" style="display:none">
  <div class="login-card">
    <div class="brand">
      <svg class="iso" viewBox="0 0 40 40"><path d="M6 4h13a11 11 0 0 1 0 22H14v10H6V4zm8 7v8h5a4 4 0 0 0 0-8h-5z" fill="#14B8A6"/><path d="M27 26l7 7-7 7v-4.5h-5v-5h5V26z" fill="#0FA3A3" opacity=".85"/></svg>
      <div><div class="brand-name">PROGESYS</div><div class="brand-sub">CALL CENTER SUITE</div></div>
    </div>
    <h2>Crea tu nueva contraseña</h2>
    <div style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:6px">Por seguridad, debes reemplazar la clave temporal antes de continuar.</div>
    <label>Contraseña nueva</label>
    <input type="password" id="nuevaClave1" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
    <label>Repite la contraseña</label>
    <input type="password" id="nuevaClave2" autocomplete="new-password" placeholder="••••••••">
    <button class="btn btn-teal" id="cambiarClaveBtn" onclick="hacerCambioClaveObligatorio()">Guardar y continuar</button>
    <div class="login-err" id="cambiarClaveErr"></div>
  </div>
</div>
<div id="app" style="display:none">
<aside>
  <div class="brand">
    <svg class="iso" viewBox="0 0 40 40"><path d="M6 4h13a11 11 0 0 1 0 22H14v10H6V4zm8 7v8h5a4 4 0 0 0 0-8h-5z" fill="#14B8A6"/><path d="M27 26l7 7-7 7v-4.5h-5v-5h5V26z" fill="#0FA3A3" opacity=".85"/></svg>
    <div><div class="brand-name">PROGESYS</div><div class="brand-sub">CALL CENTER SUITE</div></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">PROGESYS © 2026<br>Gestión de indicadores</div>
</aside>
<main>
  <header class="top">
    <h1 id="pageTitle">Dashboard</h1>
    <span id="cloudStatus" style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--ink-faint)">◌ Conectando…</span>
    <div class="spacer"></div>
    <span class="user-badge" id="userBadge"></span>
    <a class="btn btn-ghost btn-sm" href="https://manuelmc1979.github.io/suite-callcenter/index.html" style="text-decoration:none">🏠 Portal</a>
    <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="toggleTema()">🌙 Modo oscuro</button>
    <label class="btn btn-teal filebtn" id="importWrap"><span id="importLabel">⬆ Importar Excel matriz</span><input type="file" id="fileInput" accept=".xlsx,.xls"></label>
    <button class="btn btn-ghost btn-sm" onclick="hacerLogout()">Cerrar sesión</button>
  </header>
  <div id="pages"></div>
</main>
</div>
<div id="toast"></div>

<script>
/* ════════════════════════ PROGESYS · núcleo de datos ════════════════════════ */
const DEFAULT_CONFIG = {
  metas:{contactabilidad:0.85, calidad:95, adherencia:0.92, tmo:300, epa1:0.95, epa2:0.90,
         banoMin:30, banoVeces:2, descansosMin:30, colacionMin:60,
         tipificaciones:0.95, outbound:0.85, transferenciaEpa:0.85},
  turnos:[
    {t:"A", ini:"08:30", fin:"18:30", col:60, hrs:9, desc:"Jornada larga mañana"},
    {t:"B", ini:"08:30", fin:"17:30", col:60, hrs:8, desc:"Jornada estándar mañana"},
    {t:"C", ini:"08:30", fin:"16:30", col:60, hrs:7, desc:"Jornada corta"},
    {t:"D", ini:"09:30", fin:"18:30", col:60, hrs:8, desc:"Ingreso tardío"}
  ],
  indicadores:{adherencia:true,contactabilidad:true,e1snl:true,e1ep:true,e2snl:true,e2ep:true,calidad:true,tmo:true,
               banoMin:true,banoVec:true,descMin:true,colMin:true,atrasosN:true,atrasosMin:true,
               tipificaciones:true,outboundPct:true,transferenciaEpa:true}
};
/* Catálogo de indicadores del Dashboard: el Coordinador puede prender/apagar cuáles se muestran */
const INDICADORES=[
  {k:"adherencia",n:"Adherencia"},{k:"contactabilidad",n:"Contactabilidad"},
  {k:"e1snl",n:"EPA 1 SNL"},{k:"e1ep",n:"EPA 1 EP"},{k:"e2snl",n:"EPA 2 SNL"},{k:"e2ep",n:"EPA 2 EP"},
  {k:"calidad",n:"Calidad (prom.)"},{k:"tmo",n:"TMO prom. (seg)"},
  {k:"banoMin",n:"Baño (min prom)"},{k:"banoVec",n:"Baño (veces prom)"},
  {k:"descMin",n:"Descansos (min prom)"},{k:"colMin",n:"Colación (min prom)"},
  {k:"atrasosN",n:"Atrasos (cantidad)"},{k:"atrasosMin",n:"Atrasos (min total)"},
  {k:"tipificaciones",n:"Tipificaciones"},{k:"outboundPct",n:"Outbound (% contactado)"},{k:"transferenciaEpa",n:"Transferencia EPA"}
];
let S = {ejecutivos:[],asistencia:[],kpi:[],calidad:[],epa:[],epaHist:[],feedback:[],compromisos:[],incidencias:[],outbound:[],
         turnosMes:{titulo:"",dias:[],letras:[],filas:[]},config:JSON.parse(JSON.stringify(DEFAULT_CONFIG))};

function save(){ try{ localStorage.setItem("progesys_data", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const d=localStorage.getItem("progesys_data"); if(d){ const p=JSON.parse(d); S={...S,...p}; if(!p.config) S.config=JSON.parse(JSON.stringify(DEFAULT_CONFIG)); } }catch(e){} }

/* ════════════════════════ modo oscuro (aplica a todos los perfiles) ════════════════════════ */
function aplicarTema(t){
  document.documentElement.setAttribute("data-theme",t);
  const b=document.getElementById("themeBtn");
  if(b) b.textContent = t==="dark" ? "☀️ Modo claro" : "🌙 Modo oscuro";
  try{ localStorage.setItem("progesys_theme",t); }catch(e){}
}
function toggleTema(){
  const actual=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
  aplicarTema(actual==="dark"?"light":"dark");
}
try{ aplicarTema(localStorage.getItem("progesys_theme")==="dark"?"dark":"light"); }catch(e){}

/* ════════════════════════ conexión con la base de datos externa (Supabase) ════════════════════════ */
const SUPABASE_URL="https://kqlbjjgrtwtnyhvgryve.supabase.co";
const SUPABASE_KEY="sb_publishable_Cec595ifSRVaB9zNYGF7Yg_d9scVTyf";
let SB=null;
try{ if(window.supabase) SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){ console.error("Supabase init:",e); }

/* ════════════════════════ sesión y perfiles (Supabase Auth) ════════════════════════ */
let SESION=null; // {id, usuario, nombre, rol, rut, supervisor_nombre}
let VER_COMO=null; // {tipo:'ejecutivo'|'supervisor', nombre} — modo previsualización, solo coordinador
const DOMINIO_LOGIN="progesys.local";
const usuarioAEmail = u => u.includes("@") ? u.toLowerCase() : (u.trim().toLowerCase().replace(/\s+/g,"")+"@"+DOMINIO_LOGIN);
const emailAUsuario = e => String(e||"").endsWith("@"+DOMINIO_LOGIN) ? e.slice(0,-("@"+DOMINIO_LOGIN).length) : e;
async function hacerLogin(){
  const usuario=document.getElementById("loginEmail").value.trim();
  const pass=document.getElementById("loginPass").value;
  const err=document.getElementById("loginErr"), btn=document.getElementById("loginBtn");
  err.textContent="";
  if(!usuario||!pass){ err.textContent="Ingresa tu usuario y contraseña."; return; }
  if(!SB){ err.textContent="La base de datos no está disponible."; return; }
  btn.disabled=true; btn.textContent="Ingresando…";
  try{
    const {data,error}=await SB.auth.signInWithPassword({email:usuarioAEmail(usuario),password:pass});
    if(error) throw error;
    await cargarSesion(data.user.id);
  }catch(e){
    err.textContent = /invalid/i.test(e.message)? "Usuario o contraseña incorrectos." : ("Error: "+e.message);
  }finally{ btn.disabled=false; btn.textContent="Ingresar"; }
}
async function cargarSesion(userId){
  const err=document.getElementById("loginErr");
  const {data:auth}=await SB.auth.getUser();
  const {data,error}=await SB.from("progesys_usuarios").select("*").eq("id",userId).maybeSingle();
  if(error||!data){
    err.textContent="Tu usuario no tiene un perfil asignado en PROGESYS. Pide al coordinador que te agregue.";
    await SB.auth.signOut();
    return;
  }

async function hacerCambioClaveObligatorio(){

  if(p1!==p2){ err.textContent="Las dos contraseñas no coinciden."; return; }
  btn.disabled=true; btn.textContent="Guardando…";
  try{
    const {error}=await SB.auth.updateUser({password:p1});
    if(error) throw error;
    await SB.rpc("progesys_marcar_clave_cambiada");

}

const TABLE_KEY={ejecutivos:"progesys_ejecutivos",asistencia:"progesys_asistencia",kpi:"progesys_kpi",calidad:"progesys_calidad",epa:"progesys_epa",epaHist:"progesys_epa_historico",feedback:"progesys_feedback",compromisos:"progesys_compromisos",incidencias:"progesys_incidencias",outbound:"progesys_outbound"};
function toDb(map,o){ const out={}; Object.entries(map).forEach(([k,col])=>{ out[col]=(o[k]===undefined?null:o[k]); }); return out; }
function fromDb(map,row){ const out={}; Object.entries(map).forEach(([k,col])=>{ out[k]=row[col]; }); return out; }

function setCloudStatus(txt,ok){
  const el=document.getElementById("cloudStatus"); if(!el) return;
  el.textContent=(ok===true?"● ":ok===false?"○ ":"◌ ")+txt;
  el.style.color = ok===true? "var(--ok)" : ok===false? "var(--bad)" : "var(--ink-faint)";
  el.style.background = ok===true? "var(--ok-bg)" : ok===false? "var(--bad-bg)" : "var(--bg)";
}

async function pushConfig(){
  await SB.from("progesys_config").delete().gt("id",0);
  const rows=[
    ...Object.entries(S.config.metas).map(([k,v])=>({clave:"meta_"+k, valor:String(v)})),
    ...S.config.turnos.map(t=>({clave:"turno_"+t.t, valor:JSON.stringify(t)})),
    ...Object.entries(S.config.indicadores||{}).map(([k,v])=>({clave:"ind_"+k, valor:v?"1":"0"}))
  ];
  if(rows.length){ const {error}=await SB.from("progesys_config").insert(rows); if(error) throw error; }
}
async function pullConfig(){
  const {data,error}=await SB.from("progesys_config").select("*"); if(error) throw error;
  if(!S.config.indicadores) S.config.indicadores=JSON.parse(JSON.stringify(DEFAULT_CONFIG.indicadores));
  (data||[]).forEach(r=>{
    if(r.clave.startsWith("meta_")){ const k=r.clave.slice(5); const v=parseFloat(r.valor); if(!isNaN(v)) S.config.metas[k]=v; }
    else if(r.clave.startsWith("turno_")){ try{ const t=JSON.parse(r.valor); const idx=S.config.turnos.findIndex(x=>x.t===t.t); if(idx>=0) S.config.turnos[idx]=t; else S.config.turnos.push(t); }catch(e){} }
    else if(r.clave.startsWith("ind_")){ const k=r.clave.slice(4); S.config.indicadores[k]=(r.valor==="1"); }
  });
}
async function pushTurnos(){
  await SB.from("progesys_turnos_mes").delete().gt("id",0);
  const t=S.turnosMes; if(!t.filas.length) return;
  const rows=[];
  t.filas.forEach(f=>{ f.turnos.forEach((tv,i)=>{ rows.push({titulo:t.titulo, dia:t.dias[i], nombre:f.nombre, turno:tv}); }); });
  if(rows.length){ const {error}=await SB.from("progesys_turnos_mes").insert(rows); if(error) throw error; }
}
async function pullTurnos(){
  const {data,error}=await SB.from("progesys_turnos_mes").select("*"); if(error) throw error;
  if(!data||!data.length) return;
  const titulo=data[0].titulo||"";
  const dias=[...new Set(data.map(r=>r.dia))].sort((a,b)=>a-b);
  const porNombre={};
  data.forEach(r=>{ (porNombre[r.nombre]=porNombre[r.nombre]||{})[r.dia]=r.turno; });
  const filas=Object.entries(porNombre).map(([nombre,byDay],i)=>({n:i+1, nombre, turnos:dias.map(d=>byDay[d]||"")}));
  S.turnosMes={titulo, dias, letras:dias.map(()=>""), filas};
}

/* Sube una sola tabla a la nube (reemplaza todo su contenido por el de S[key]) */
async function syncTable(key){
  if(!SB) return;
  try{
    const table=TABLE_KEY[key], map=FIELD_MAPS[key], arr=S[key]||[];
    await SB.from(table).delete().gt("id",0);
    if(arr.length){ const {error}=await SB.from(table).insert(arr.map(o=>toDb(map,o))); if(error) throw error; }
  }catch(e){ console.error(e); toast("No se pudo sincronizar con la nube: "+e.message); }
}
/* Sube TODOS los módulos a la nube */
async function syncToCloud(){
  if(!SB){ toast("La base de datos no está conectada."); return; }
  setCloudStatus("Subiendo…");
  try{
    for(const key of Object.keys(TABLE_KEY)) await syncTable(key);
    await pushConfig(); await pushTurnos();
    setCloudStatus("Conectado",true);
    toast("Datos subidos a la base de datos");
  }catch(e){ setCloudStatus("Error al subir",false); toast("Error al subir a la nube: "+e.message); }
}
/* Descarga TODOS los módulos desde la nube (reemplaza los datos locales) */
async function loadFromCloud(showToast){
  if(!SB){ if(showToast) toast("La base de datos no está conectada."); return false; }
  setCloudStatus("Descargando…");
  try{
    for(const key of Object.keys(TABLE_KEY)){
      const table=TABLE_KEY[key], map=FIELD_MAPS[key];
      const {data,error}=await SB.from(table).select("*"); if(error) throw error;
      S[key]=(data||[]).map(r=>fromDb(map,r));
    }
    await pullConfig(); await pullTurnos();
    recalcAsistencia(); save(); render(CUR);
    setCloudStatus("Conectado",true);
    if(showToast) toast("Datos descargados de la base de datos");
    return true;
  }catch(e){ setCloudStatus("Sin conexión",false); if(showToast) toast("Error al descargar: "+e.message); return false; }
}

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._x); t._x=setTimeout(()=>t.style.display="none",3800); }
function clearAll(){ if(confirm("¿Borrar todos los datos cargados en PROGESYS?")){ localStorage.removeItem("progesys_data"); location.reload(); } }
const clean = s => String(s??"").replace(/ACHS(\s+SALUD)?/gi,"PROGESYS").trim();
const norm = s => String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
/* Normaliza un Rut ignorando puntos, guiones, espacios y mayúsculas/minúsculas, para que el mismo
   ejecutivo se reconozca aunque el Rut esté escrito distinto en cada hoja (ej. "13.337.549-k" vs
   "13337549-K"). Se usa como llave de cruce en vez de comparar el texto tal cual. */
const normRut = s => String(s??"").toUpperCase().replace(/[^0-9K]/g,"");
/* Llave única para agrupar/cruzar registros de una misma persona entre hojas: Rut normalizado si
   existe, si no, el nombre normalizado como respaldo. */
const keyOf = (rut,nombre) => normRut(rut) ? "R:"+normRut(rut) : "N:"+norm(nombre);
const mismoExec = (o,e) => keyOf(o.rut,o.nombre)===keyOf(e.rut,e.nombre);
const num = v => { if(v===null||v===undefined||v==="")return null; if(typeof v==="number")return v; let s=String(v).replace("%","").replace(",",".").trim(); const n=parseFloat(s); return isNaN(n)?null:n; };
const pct = v => v==null?"—":Math.round(v>1.5? v : v*100)+"%";
const fx  = (v,d=1) => v==null?"—":(+v).toFixed(d).replace(/\.0$/,"");
function excelDate(v){
  if(v===null||v===undefined||v==="") return "";
  if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return s;
}
function excelTime(v){
  if(v===null||v===undefined||v==="") return "";
  if(typeof v==="number"){ const t=v%1, h=Math.floor(t*24), mi=Math.round((t*24-h)*60); return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`; }
  const m=String(v).match(/(\d{1,2}):(\d{2})/); return m?`${m[1].padStart(2,"0")}:${m[2]}`:String(v);
}
/* semáforo: dir=1 mayor es mejor · dir=-1 menor es mejor */
function light(v, meta, dir=1, tol=0.03){
  if(v==null||meta==null) return "N";
  if(dir===1){ if(v>=meta) return "V"; if(v>=meta*(1-tol)) return "A"; return "R"; }
  if(v<=meta) return "V"; if(v<=meta*(1+tol)) return "A"; return "R";
}

/* Si Nombre llegó vacío o como texto de fórmula sin calcular (el archivo no se guardó en Excel
   antes de subirlo), lo completa igual buscando por Rut en Ejecutivos — red de seguridad. */
function backfillNombres(){
  const arrs=[S.kpi,S.calidad,S.epa,S.epaHist,S.outbound];
  arrs.forEach(arr=>{ arr.forEach(o=>{
    if(o.rut && (!o.nombre || String(o.nombre).startsWith("="))){
      const e=S.ejecutivos.find(e=>normRut(e.rut)===normRut(o.rut)); if(e) o.nombre=e.nombre;
    }
    if(o.supervisor!==undefined && o.rut && (!o.supervisor || String(o.supervisor).startsWith("="))){
      const e=S.ejecutivos.find(e=>normRut(e.rut)===normRut(o.rut)); if(e) o.supervisor=e.supervisor;
    }
  }); });
}
function headerRow(rows){
  for(let i=0;i<Math.min(rows.length,6);i++){ const filled=rows[i].filter(c=>c!==null&&c!=="").length; if(filled>=3) return i; }
  return 0;
}
function headSet(rows){ const hi=headerRow(rows); return rows[hi]? rows[hi].map(h=>norm(h)) : []; }
function timeFrac(v){
  if(v===null||v===undefined||v==="") return null;
  if(typeof v==="number") return v%1;
  const m=String(v).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(!m) return null;
  return (parseInt(m[1],10)*3600+parseInt(m[2],10)*60+(parseInt(m[3],10)||0))/86400;
}
function turnoDelDia(nombre, fecha){
  if(!S.turnosMes.filas.length || !fecha || !nombre) return "";
  const day=parseInt(String(fecha).split("-")[2],10);
  const idx=S.turnosMes.dias.indexOf(day);
  if(idx<0) return "";
  const fila=S.turnosMes.filas.find(f=>norm(f.nombre)===norm(nombre));
  return fila? (fila.turnos[idx]||"") : "";
}
/* Fusiona un lote nuevo de Asistencia con el histórico ya cargado, en vez de reemplazarlo entero.
   Clave única = rut + fecha: si el nuevo lote trae un día que ya existía (mismo rut y fecha), lo
   reemplaza (evita duplicados al volver a subir el mismo mes); los días de otros meses que no
   vienen en este archivo se conservan tal cual. Así cada Excel mensual se ACUMULA en vez de borrar
   los meses anteriores. */
function mergeAsistencia(nuevos){
  const key=o=>normRut(o.rut)+"|"+(o.fecha||"");
  const nuevasClaves=new Set(nuevos.map(key));
  const conservados=S.asistencia.filter(o=>!nuevasClaves.has(key(o)));
  S.asistencia=conservados.concat(nuevos);
}
/* Recalcula los campos derivados de Asistencia (los que en el Excel modelo son fórmulas:
   Nombre por Rut, Turno del día, Minutos de atraso, Minutos de colación, Tiempo total descanso,
   Desviación del turno, Estado, Salida anticipada y Adherencia) usando la misma lógica que las
   fórmulas del libro modelo. Solo completa campos vacíos: nunca pisa un valor ya cargado. */
function recalcAsistencia(){
  S.asistencia.forEach(o=>{
    if(!o.nombre && o.rut){ const e=S.ejecutivos.find(e=>normRut(e.rut)===normRut(o.rut)); if(e) o.nombre=e.nombre; }
    if(!o.turno && o.nombre && o.fecha){ const t=turnoDelDia(o.nombre,o.fecha); if(t) o.turno=t; }
    const turnoCfg = o.turno ? S.config.turnos.find(t=>t.t===o.turno) : null;
    const hInF=timeFrac(o.hIn), hOutF=timeFrac(o.hOut), colIniF=timeFrac(o.colIni), colFinF=timeFrac(o.colFin);
    if((o.efectivo===null||o.efectivo===undefined) && hInF!=null && hOutF!=null){
      let base=(hOutF-hInF)*24;
      if(colIniF!=null&&colFinF!=null) base-=(colFinF-colIniF)*24;
      base-=((o.d1||0)+(o.d2||0))/60;
      o.efectivo=Math.round(base*100)/100;
    }
    if((o.atrasoMin===null||o.atrasoMin===undefined) && hInF!=null && turnoCfg){
      const iniF=timeFrac(turnoCfg.ini); o.atrasoMin=Math.max(0,Math.round((hInF-iniF)*24*60)); }
    if((o.colMin===null||o.colMin===undefined) && colIniF!=null && colFinF!=null) o.colMin=Math.round((colFinF-colIniF)*24*60);
    if((o.descTotal===null||o.descTotal===undefined) && o.colMin!=null) o.descTotal=o.colMin+(o.d1||0)+(o.d2||0);
    if((o.desvTurno===null||o.desvTurno===undefined) && o.descTotal!=null && turnoCfg) o.desvTurno=o.descTotal-turnoCfg.col;
    if(!o.estado && o.fecha){ if(hInF==null) o.estado="Ausente"; else if(o.atrasoMin!=null) o.estado=o.atrasoMin>0?"Atrasado":"Puntual"; }
    if((o.salidaAnt===null||o.salidaAnt===undefined) && hOutF!=null && turnoCfg){
      const finF=timeFrac(turnoCfg.fin); o.salidaAnt=Math.max(0,Math.round((finF-hOutF)*1440)); }
    if((o.adh===null||o.adh===undefined) && o.atrasoMin!=null && o.salidaAnt!=null && turnoCfg){
      const iniF=timeFrac(turnoCfg.ini), finF=timeFrac(turnoCfg.fin);
      const jornada=Math.round((finF-iniF)*1440);
      if(jornada>0) o.adh=Math.max(0,1-(o.atrasoMin+o.salidaAnt+Math.max(0,o.desvTurno||0))/jornada);
    }
  });
}
function mapRows(rows, map, types={}){
  if(!rows.length) return [];
  const hi=headerRow(rows), heads=rows[hi].map(h=>norm(h)), out=[];
  const idx={}; Object.entries(map).forEach(([k,alts])=>{ idx[k]=heads.findIndex(h=>h&&alts.some(a=>h===a||h.startsWith(a))); });
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; if(!r||r.every(c=>c===null||c===""))continue;
    const o={}; let any=false;
    Object.keys(map).forEach(k=>{ const j=idx[k]; let v=j>=0?r[j]:null;
      if(v!==null&&v!==""){ any=true;
        if(types[k]==="date") v=excelDate(v); else if(types[k]==="time") v=excelTime(v);
        else if(types[k]==="n") v=num(v); else v=clean(v); }
      else v=(types[k]==="n")?null:"";
      o[k]=v; });
    if(any) out.push(o); }
  return out;
}
function importAsistencia(rows){
  const hi=headerRow(rows), heads=rows[hi].map(h=>norm(h));
  const find=alts=>heads.findIndex(h=>h&&alts.some(a=>h.startsWith(a)));
  const I={fecha:find(["fecha"]),rut:find(["rut"]),nombre:find(["nombre"]),hIn:find(["horaingreso"]),hOut:find(["horasalida"]),
    colIni:find(["iniciocomida","iniciocolacion"]),colFin:find(["fincomid","fincolacion"]),d1:find(["descanso1"]),d2:find(["descanso2"]),
    banoMin:find(["bano"]),banoVec:find(["banoveces"]),capMin:find(["capacitacion"]),efectivo:find(["tiempoefectivo"]),
    atrasoMin:find(["minutosdeatraso","minatraso"]),colMin:find(["minutosdecol","mincolacion"])};
  if(I.banoVec===I.banoMin) I.banoVec=heads.findIndex((h,j)=>j>I.banoMin&&h&&h.startsWith("bano"));
  const nuevos=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; if(!r||r.every(c=>c===null||c===""))continue;
    const o={};
    o.fecha=excelDate(I.fecha>=0?r[I.fecha]:null); o.rut=clean(I.rut>=0?r[I.rut]:""); o.nombre=clean(I.nombre>=0?r[I.nombre]:"");
    o.hIn=excelTime(I.hIn>=0?r[I.hIn]:""); o.hOut=excelTime(I.hOut>=0?r[I.hOut]:"");
    o.colIni=excelTime(I.colIni>=0?r[I.colIni]:""); o.colFin=excelTime(I.colFin>=0?r[I.colFin]:"");
    o.d1=num(I.d1>=0?r[I.d1]:null); o.d2=num(I.d2>=0?r[I.d2]:null);
    o.banoMin=num(I.banoMin>=0?r[I.banoMin]:null); o.banoVec=num(I.banoVec>=0?r[I.banoVec]:null);
    o.capMin=num(I.capMin>=0?r[I.capMin]:null); o.efectivo=num(I.efectivo>=0?r[I.efectivo]:null);
    o.atrasoMin=num(I.atrasoMin>=0?r[I.atrasoMin]:null); o.colMin=num(I.colMin>=0?r[I.colMin]:null);
    /* columnas sin encabezado al final: estado, turno y adherencia */
    o.turno=""; o.estado=""; o.adh=null; o.descTotal=null; o.desvTurno=null; o.salidaAnt=null; o.obs="";
    for(let j=r.length-1;j>Math.max(I.atrasoMin,I.colMin,10);j--){ const v=r[j]; if(v===null||v==="")continue;
      if(typeof v==="string"){ const s=v.trim();
        if(/^(puntual|atrasado)$/i.test(s)&&!o.estado) o.estado=s[0].toUpperCase()+s.slice(1).toLowerCase();
        else if(/^[A-EV]$/i.test(s)&&!o.turno) o.turno=s.toUpperCase(); }
      else if(typeof v==="number"&&v>0&&v<=1.2&&o.adh===null) o.adh=v; }
    if(o.fecha||o.rut||o.nombre) nuevos.push(o); }

/* Modelo de Asistencia con fórmulas (Libro2): las columnas Nombre, Minutos de atraso, Minutos de
   colación, Tiempo total descanso, Desviación del turno, Estado, Turno del día, Salida anticipada
   y Adherencia son fórmulas en el Excel (usan lookups a Ejecutivos/Config/Turno). Aquí se importan
   solo los datos crudos y luego recalcAsistencia() reproduce esas mismas fórmulas. */
function importAsistenciaFormula(rows){
  const hi=headerRow(rows), heads=rows[hi].map(h=>norm(h));
  const find=alts=>heads.findIndex(h=>h&&alts.some(a=>h===a||h.startsWith(a)));
  const I={
    fecha:find(["fecha"]), rut:find(["rut"]),
    hIn:find(["horaingreso"]), hOut:find(["horasalida"]),
    colIni:find(["iniciocomida","iniciocolacion"]), colFin:find(["fincomid","fincolacion"]),
    d1:find(["descanso1"]), d2:find(["descanso2"]),
    banoMin:find(["bano"]), banoVec:find(["banoveces"]),
    capMin:find(["capacitacion"]), obs:find(["observaciones"])
  };
  if(I.banoVec===I.banoMin) I.banoVec=heads.findIndex((h,j)=>j>I.banoMin&&h&&h.startsWith("bano")&&j!==I.banoMin);
  const nuevos=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; if(!r||r.every(c=>c===null||c===""))continue;
    const fecha=excelDate(I.fecha>=0?r[I.fecha]:null);
    const rut=clean(I.rut>=0?r[I.rut]:"");
    if(!fecha && !rut) continue;
    const hInRaw=I.hIn>=0?r[I.hIn]:null, hOutRaw=I.hOut>=0?r[I.hOut]:null;
    const colIniRaw=I.colIni>=0?r[I.colIni]:null, colFinRaw=I.colFin>=0?r[I.colFin]:null;
    const hInF=timeFrac(hInRaw), hOutF=timeFrac(hOutRaw), colIniF=timeFrac(colIniRaw), colFinF=timeFrac(colFinRaw);
    const d1=num(I.d1>=0?r[I.d1]:null), d2=num(I.d2>=0?r[I.d2]:null);
    const ejec=S.ejecutivos.find(e=>normRut(e.rut)===normRut(rut));
    const nombre=ejec? ejec.nombre : "";
    const turno=turnoDelDia(nombre,fecha);
    const turnoCfg=turno? S.config.turnos.find(t=>t.t===turno) : null;
    /* Réplica exacta (con precisión de segundos) de las fórmulas del libro modelo */
    let efectivo=null;
    if(hInF!=null&&hOutF!=null){ let base=(hOutF-hInF)*24; if(colIniF!=null&&colFinF!=null) base-=(colFinF-colIniF)*24; base-=((d1||0)+(d2||0))/60; efectivo=Math.round(base*100)/100; }
    let atrasoMin=null;
    if(hInF!=null&&turnoCfg){ const iniF=timeFrac(turnoCfg.ini); atrasoMin=Math.max(0,Math.round((hInF-iniF)*24*60)); }
    let colMin=null;
    if(colIniF!=null&&colFinF!=null) colMin=Math.round((colFinF-colIniF)*24*60);
    let descTotal=colMin!=null? colMin+(d1||0)+(d2||0) : null;
    let desvTurno=(descTotal!=null&&turnoCfg)? descTotal-turnoCfg.col : null;
    let estado=""; if(fecha){ if(hInF==null) estado="Ausente"; else if(atrasoMin!=null) estado=atrasoMin>0?"Atrasado":"Puntual"; }
    let salidaAnt=null;
    if(hOutF!=null&&turnoCfg){ const finF=timeFrac(turnoCfg.fin); salidaAnt=Math.max(0,Math.round((finF-hOutF)*1440)); }
    let adh=null;
    if(atrasoMin!=null&&salidaAnt!=null&&turnoCfg){ const iniF=timeFrac(turnoCfg.ini), finF=timeFrac(turnoCfg.fin); const jornada=Math.round((finF-iniF)*1440); if(jornada>0) adh=Math.max(0,1-(atrasoMin+salidaAnt+Math.max(0,desvTurno||0))/jornada); }
    const o={
      fecha, rut, nombre,
      hIn:excelTime(hInRaw), hOut:excelTime(hOutRaw), colIni:excelTime(colIniRaw), colFin:excelTime(colFinRaw),
      d1, d2,
      banoMin:num(I.banoMin>=0?r[I.banoMin]:null), banoVec:num(I.banoVec>=0?r[I.banoVec]:null),
      capMin:num(I.capMin>=0?r[I.capMin]:null),
      efectivo, atrasoMin, colMin, descTotal, desvTurno,
      turno, estado, salidaAnt, adh,
      obs:clean(I.obs>=0?r[I.obs]:"")
    };
    nuevos.push(o);
  }
  mergeAsistencia(nuevos);
}
function importTurnos(titulo,rows){
  if(rows.length<3) return;
  const hd=rows[0], dias=[], cols=[];
  for(let j=2;j<hd.length;j++){ const v=hd[j]; if(v!==null&&v!==""&&!isNaN(num(v))){ dias.push(num(v)); cols.push(j); } }
  const letras=cols.map(j=>String(rows[1]?.[j]??""));
  const filas=[];
  for(let i=2;i<rows.length;i++){ const r=rows[i]; if(!r)continue;
    const nombre=clean(r[1]); if(!nombre)continue;
    filas.push({n:r[0]??filas.length+1, nombre, turnos:cols.map(j=>String(r[j]??"").toUpperCase())}); }
  S.turnosMes={titulo:clean(titulo), dias, letras, filas};
}
function importConfig(rows){
  rows.forEach(r=>{ if(!r)return;
    const vals=r.filter(v=>v!==null&&v!=="");
    if(vals.length<2) return;
    const k=norm(vals[0]), v=num(vals[1]);
    if(v===null)return;
    if(k.startsWith("contactabilidad")) S.config.metas.contactabilidad=v;
    else if(k.startsWith("calidad")) S.config.metas.calidad=v;
    else if(k.startsWith("adherencia")) S.config.metas.adherencia=v;
    else if(k.startsWith("tmo")) S.config.metas.tmo=v;
    else if(k.startsWith("epa1")) S.config.metas.epa1=v>1?v/100:v;
    else if(k.startsWith("epa2")) S.config.metas.epa2=v>1?v/100:v;
    else if(k.startsWith("tipificacion")) S.config.metas.tipificaciones=v>1?v/100:v;
    else if(k.startsWith("outbound")) S.config.metas.outbound=v>1?v/100:v;
    else if(k.startsWith("transferencia")) S.config.metas.transferenciaEpa=v>1?v/100:v;
    else if(k==="epa"&&S.config.metas.epa1==null) S.config.metas.epa1=v>1?v/100:v; });
  /* bloque de turnos: busca la fila cuyo primer valor no vacío sea "turno", y toma las filas
     siguientes como turnos (letra, hora inicio, hora término, colación, hrs, descripción) */
  const primerValor=r=>{ const vals=(r||[]).filter(v=>v!==null&&v!==""); return vals.length? vals[0] : null; };
  const hi=rows.findIndex(r=>norm(primerValor(r))==="turno");
  if(hi>=0){ const ts=[];
    for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; const vals=(r||[]).filter(v=>v!==null&&v!=="");
      if(!vals.length||String(vals[0]).length>2) break;
      ts.push({t:String(vals[0]).trim(), ini:excelTime(vals[1]), fin:excelTime(vals[2]), col:num(vals[3])??60, hrs:num(String(vals[4]??"").replace(",","."))??0, desc:clean(vals[5])}); }
    if(ts.length) S.config.turnos=ts; }
}

/* ════════════════════════ agregaciones ════════════════════════ */
const avg = a => { const v=a.filter(x=>x!=null&&!isNaN(x)); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; };
const sum = a => a.filter(x=>x!=null&&!isNaN(x)).reduce((s,x)=>s+x,0);
function metricsGlobal(){
  const M=S.config.metas, A=S.asistencia, K=S.kpi, E=S.epa, O=S.outbound;
  const adh = avg(A.map(r=>r.adh)) ?? avg(K.map(r=>r.adh));
  const atrasos=A.filter(r=>(r.atrasoMin??0)>0);
  const outboundPctRow = r => r.pctContacto!=null? r.pctContacto : ((r.contactados!=null&&r.noContactados!=null&&(r.contactados+r.noContactados)>0)? r.contactados/(r.contactados+r.noContactados) : null);
  return {
    adherencia:{v:adh, meta:M.adherencia, dir:1, f:pct},
    contactabilidad:{v:avg(K.map(r=>r.contact)), meta:M.contactabilidad, dir:1, f:pct},
    e1snl:{v:avg(E.map(r=>r.e1snl)), meta:M.epa1, dir:1, f:pct, n:"EPA 1 SNL"},
    e1ep:{v:avg(E.map(r=>r.e1ep)), meta:M.epa1, dir:1, f:pct, n:"EPA 1 EP"},
    e2snl:{v:avg(E.map(r=>r.e2snl)), meta:M.epa2, dir:1, f:pct, n:"EPA 2 SNL"},
    e2ep:{v:avg(E.map(r=>r.e2ep)), meta:M.epa2, dir:1, f:pct, n:"EPA 2 EP"},
    banoMin:{v:avg(A.map(r=>r.banoMin)), meta:M.banoMin, dir:-1, f:v=>fx(v)},
    banoVec:{v:avg(A.map(r=>r.banoVec)), meta:M.banoVeces, dir:-1, f:v=>fx(v)},
    descMin:{v:avg(A.map(r=>(r.d1??0)+(r.d2??0))), meta:M.descansosMin, dir:-1, f:v=>fx(v)},
    colMin:{v:avg(A.map(r=>r.colMin)), meta:M.colacionMin, dir:-1, f:v=>fx(v)},
    atrasosN:{v:atrasos.length, meta:0, dir:-1, f:v=>fx(v,0), tol:0},
    atrasosMin:{v:sum(A.map(r=>r.atrasoMin)), meta:0, dir:-1, f:v=>fx(v,0), tol:0},
    calidad:{v:avg(S.calidad.map(r=>r.puntaje)), meta:M.calidad, dir:1, f:v=>fx(v)},
    tmo:{v:avg(K.map(r=>r.tmo)), meta:M.tmo, dir:-1, f:v=>fx(v,0)},
    tipificaciones:{v:avg(K.map(r=>r.tipificaciones)), meta:M.tipificaciones, dir:1, f:pct},
    outboundPct:{v:avg(O.map(outboundPctRow)), meta:M.outbound, dir:1, f:pct},
    transferenciaEpa:{v:avg(E.map(r=>r.transferencia)), meta:M.transferenciaEpa, dir:1, f:pct}
  };
}
function byExec(){
  const map={};
  S.ejecutivos.forEach(e=>{ map[keyOf(e.rut,e.nombre)]={rut:e.rut,nombre:e.nombre,supervisor:e.supervisor,equipo:e.equipo,cargo:e.cargo,estado:e.estado}; });
  const g=(rut,nombre)=>{ const k=keyOf(rut,nombre); if(!map[k]) map[k]={rut:rut||"",nombre:nombre||""}; return map[k]; };
  const acc={};
  S.asistencia.forEach(r=>{ const k=keyOf(r.rut,r.nombre); (acc[k]=acc[k]||{adh:[],ban:[],atr:0,atrN:0}).adh.push(r.adh); acc[k].ban.push(r.banoMin); acc[k].atr+=r.atrasoMin??0; if((r.atrasoMin??0)>0)acc[k].atrN++; g(r.rut,r.nombre); });
  Object.entries(acc).forEach(([k,a])=>{ if(map[k]){ map[k].adh=avg(a.adh); map[k].banoMin=avg(a.ban); map[k].atrasoMin=a.atr; map[k].atrasosN=a.atrN; } });
  S.kpi.forEach(r=>{ const o=g(r.rut,r.nombre); o.contact=r.contact; o.tmo=r.tmo; o.llamadas=r.llamadas; if(o.adh==null)o.adh=r.adh; });
  S.epa.forEach(r=>{ const o=g(r.rut,r.nombre); o.e1snl=r.e1snl; o.e2snl=r.e2snl; o.e1ep=r.e1ep; o.e2ep=r.e2ep; });
  return Object.values(map).filter(o=>o.nombre);
}

function cellHTML(r,c,m){
  let v=r[c.k];
  if(c.t==="pct"){ const M=S.config.metas;
    let meta=null, dir=1;
    if(c.k==="adh")meta=M.adherencia; if(c.k==="contact")meta=M.contactabilidad;
    if(["e1snl","e1ep"].includes(c.k))meta=M.epa1; if(["e2snl","e2ep"].includes(c.k))meta=M.epa2;
    const L=light(v,meta,dir);
    return `<td class="num">${meta!=null&&v!=null?`<span class="pill ${L}">${pct(v)}</span>`:pct(v)}</td>`; }
  if(c.t==="n"){ if(c.k==="puntaje"&&v!=null){ const L=light(v,S.config.metas.calidad,1,0.05); return `<td class="num"><span class="pill ${L}">${fx(v,0)}</span></td>`; }
                 if(c.k==="tmo"&&v!=null){ const L=light(v,S.config.metas.tmo,-1,0.1); return `<td class="num"><span class="pill ${L}">${fx(v,0)}</span></td>`; }
                 return `<td class="num">${v==null?"—":fx(v,2).replace(/\.00$/,"")}</td>`; }
  if(c.k==="estado"&&m.key==="compromisos"){ const map={Cumplido:"V","En proceso":"A",Vencido:"R"}; return `<td><span class="pill ${map[v]||"N"}">${v||"—"}</span></td>`; }
  if(c.k==="estado"&&m.key==="asistencia"){ return `<td><span class="pill ${v==="Puntual"?"V":v==="Atrasado"?"R":"N"}">${v||"—"}</span></td>`; }
  if(c.k==="cumple"){ return `<td><span class="pill ${v==="Cumple"?"V":v==="No cumple"?"R":"N"}">${v||"—"}</span></td>`; }
  if(c.k==="critico"){ return `<td><span class="pill ${/^s/i.test(v||"")?"R":"V"}">${v||"No"}</span></td>`; }
  if(c.k==="turno"&&v){ return `<td><span class="turn-cell t${"ABCDV".includes(v)?v:"X"}">${v}</span></td>`; }
  return `<td>${v===null||v===undefined||v===""?"—":v}</td>`;
}

        .map(x=>({...x, score: avg([x.e1snl,x.e2ep])}))
        .filter(x=>x.score!=null)
        .sort((a,b)=>b.score-a.score).slice(0,3);
      if(!rank.length) return `<div class="empty">Aún no hay datos de EPA del mes en curso para armar el ranking.</div>`;
      const medallas=["🥇","🥈","🥉"];
      return `<div class="tblwrap"><table><thead><tr><th></th><th>Ejecutivo</th><th>EPA 1 SNL</th><th>EPA 2 EP</th><th>Promedio</th></tr></thead><tbody>
        ${rank.map((x,i)=>`<tr><td style="font-size:18px">${medallas[i]}</td><td>${x.nombre}</td>
          <td class="num"><span class="pill ${light(x.e1snl,M.epa1)}">${pct(x.e1snl)}</span></td>
          <td class="num"><span class="pill ${light(x.e2ep,M.epa2)}">${pct(x.e2ep)}</span></td>
          <td class="num" style="font-weight:800;color:var(--ink-strong)">${pct(x.score)}</td></tr>`).join("")}
      </tbody></table></div>`;
    })()}
  </div>
  <div class="panel"><h2>Historial EPA · últimos 6 meses por ejecutivo (SNL y EP)</h2>
    ${tablaEpaHistPorEjecutivo()}
  </div>
  ${(SESION && SESION.rol!=="ejecutivo")? `
  <details class="panel ind-panel" ${INGRESOS_PANEL_ABIERTO?"open":""} ontoggle="INGRESOS_PANEL_ABIERTO=this.open">
    <summary>Ingresos al programa por ejecutivo <span class="ind-count">${INGRESOS_EQUIPO.length} ejecutivos</span><span class="ind-arrow">▸</span></summary>
    <div class="ind-body">
      <div style="margin-bottom:12px"><button class="btn btn-teal btn-sm" onclick="exportarHistorialIngresos()">⬇ Exportar historial detallado (Excel: usuario, fecha y hora)</button></div>
      ${INGRESOS_EQUIPO.length? `<div class="tblwrap"><table><thead><tr><th>Ejecutivo</th><th>Veces que ha ingresado</th><th>Último ingreso</th></tr></thead><tbody>
        ${INGRESOS_EQUIPO.map(u=>`<tr><td>${u.nombre||"—"}</td><td class="num">${u.veces_ingreso??0}</td><td>${u.ultimo_ingreso? new Date(u.ultimo_ingreso).toLocaleString("es-CL"):"Nunca"}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">Aún no hay datos de ingreso de ejecutivos (o todavía nadie de tu equipo ha entrado a PROGESYS).</div>`}
    </div>
  </details>` : ""}`;
}
/* Gráfico de línea (SVG, sin librerías externas) del promedio global de EPA SNL (e1snl+e2snl)
   y EPA EP (e1ep+e2ep) por mes, usando los últimos 6 meses disponibles en EPA_Historico. */
const MESES_CORTOS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function mesLabel(m){ const [y,mm]=m.split("-"); return MESES_CORTOS[(+mm||1)-1]+" "+String(y).slice(2); }
function ultimosMesesEpa(n=6){ return [...new Set(S.epaHist.map(r=>r.mes? String(r.mes).slice(0,7):null).filter(Boolean))].sort().slice(-n); }
/* Tabla de datos: una fila por ejecutivo, una columna por cada uno de los últimos 6 meses,
   mostrando EPA SNL (promedio EPA1+EPA2 SNL) y EPA EP (promedio EPA1+EPA2 EP) de ese mes. */
function tablaEpaHistPorEjecutivo(){
  const meses=ultimosMesesEpa(6);
  if(!meses.length) return `<div class="empty">Aún no hay historial mensual de EPA cargado (hoja EPA_Historico).</div>`;
  const M=S.config.metas;
  const porExec={};
  S.epaHist.forEach(r=>{ if(!r.mes) return; const m=String(r.mes).slice(0,7); if(!meses.includes(m)) return;
    const k=keyOf(r.rut,r.nombre);
    const o=porExec[k]=porExec[k]||{nombre:r.nombre,rut:r.rut,datos:{}};
    o.datos[m]={snl:avg([r.e1snl,r.e2snl]), ep:avg([r.e1ep,r.e2ep])};
  });
  const filas=Object.values(porExec).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  if(!filas.length) return `<div class="empty">Aún no hay historial mensual de EPA cargado (hoja EPA_Historico).</div>`;
  const metaProm=avg([M.epa1,M.epa2]);
  const celda=v=> v==null? `<span style="color:var(--ink-faint)">—</span>` : `<span class="pill ${light(v,metaProm)}">${pct(v)}</span>`;
  return `<div class="tblwrap" style="max-height:520px;overflow:auto"><table>
    <thead><tr><th>Ejecutivo</th>${meses.map(m=>`<th colspan="2" style="text-align:center">${mesLabel(m)}</th>`).join("")}</tr>
    <tr><th></th>${meses.map(()=>`<th style="text-align:center">SNL</th><th style="text-align:center">EP</th>`).join("")}</tr></thead>
    <tbody>
    ${filas.map(f=>`<tr><td style="white-space:nowrap">${f.nombre}</td>
      ${meses.map(m=>{ const d=f.datos[m]; return `<td class="num">${celda(d&&d.snl)}</td><td class="num">${celda(d&&d.ep)}</td>`; }).join("")}
    </tr>`).join("")}
    </tbody></table></div>
  <div class="legend"><span>SNL = promedio EPA 1 SNL + EPA 2 SNL del mes</span><span>EP = promedio EPA 1 EP + EPA 2 EP del mes</span></div>`;
}
function bars(execs,key,meta){
  const rows=execs.filter(e=>e[key]!=null).sort((a,b)=>b[key]-a[key]);
  if(!rows.length) return `<div class="empty">Sin datos.</div>`;
  return rows.map(e=>`<div class="bar-row"><span class="lbl" title="${e.nombre}">${e.nombre}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.min(e[key]*100,100)}%;${e[key]<meta?"background:linear-gradient(90deg,#E0A83A,#C9880A)":""}"></div></div>
    <span class="bar-val">${pct(e[key])}</span></div>`).join("");
}
